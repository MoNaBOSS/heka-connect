<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Wallet — Heka & Affiliates</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1a1a2e;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }
    .icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #f0a020, #ff8a00);
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
    .subtitle { color: #aaa; font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
    .status {
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      text-align: left;
    }
    .status.info    { background: #0e2a4d; border: 1px solid #1a4a8a; color: #88bbff; display: block; }
    .status.success { background: #0a3d1c; border: 1px solid #1a6b3a; color: #7fffaa; display: block; }
    .status.error   { background: #4d0e0e; border: 1px solid #8a1a1a; color: #ff8888; display: block; }
    .btn {
      background: linear-gradient(135deg, #f0a020, #ff8a00);
      color: #000;
      border: none;
      padding: 16px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: transform 0.15s, opacity 0.15s;
      letter-spacing: 0.5px;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .help {
      margin-top: 24px;
      text-align: left;
      font-size: 13px;
      color: #777;
      line-height: 1.8;
    }
    .help li { margin-left: 18px; }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⬢</div>
    <h1>Connect Your Wallet</h1>
    <p class="subtitle">Link a Web3 wallet to claim your KA Token rewards on Base mainnet.</p>
    <div id="status" class="status"></div>
    <button id="connect-btn" class="btn">Connect Wallet</button>
    <ul class="help">
      <li>Use MetaMask — desktop extension or mobile app</li>
      <li>Make sure you're on <strong style="color:#f0a020">Base Mainnet</strong></li>
      <li>Your earned rewards are waiting for you</li>
    </ul>
  </div>

  <script src="https://c0f4f41c-2f55-4863-921b-sdk-docs.github.io/cdn/metamask-sdk.js"></script>
  <script>
  (function(){
    'use strict';

    var TARGET_CHAIN_HEX = '0x2105'; // Base mainnet (8453)

    // Parse query params passed from WordPress
    var params      = new URLSearchParams(window.location.search);
    var WP_NONCE    = params.get('nonce')      || '';
    var RETURN_URL  = params.get('return')     || 'https://hekaaffiliates.com/affiliate-area/crypto-rewards/';
    var WP_ORIGIN   = 'https://hekaaffiliates.com';

    var btn = document.getElementById('connect-btn');

    function setStatus(msg, type) {
      var el = document.getElementById('status');
      el.innerHTML = msg;
      el.className = 'status ' + type;
    }

    function saveWalletOnWP(addr) {
      return fetch(WP_ORIGIN + '/wp-json/kar/v1/wallet', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-WP-Nonce': WP_NONCE
        },
        credentials: 'include',
        body: JSON.stringify({ wallet: addr })
      })
      .then(function(r){ return r.json(); })
      .then(function(d){ return d && d.status === 'saved'; });
    }

    function switchToBase(provider) {
      return provider.request({
        method: 'wallet_switchEthereumChain',
        params: [{ chainId: TARGET_CHAIN_HEX }]
      }).catch(function(err) {
        if (err && (err.code === 4902 || JSON.stringify(err).indexOf('4902') !== -1)) {
          return provider.request({
            method: 'wallet_addEthereumChain',
            params: [{
              chainId: TARGET_CHAIN_HEX,
              chainName: 'Base',
              nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
              rpcUrls: ['https://mainnet.base.org'],
              blockExplorerUrls: ['https://basescan.org']
            }]
          });
        }
        throw err;
      });
    }

    var MMSDK = null;

    // Wait for SDK to load
    function whenReady(cb) {
      if (typeof MetaMaskSDK !== 'undefined' && MetaMaskSDK.MetaMaskSDK) { cb(); return; }
      var tries = 0, t = setInterval(function(){
        if (typeof MetaMaskSDK !== 'undefined' && MetaMaskSDK.MetaMaskSDK) {
          clearInterval(t); cb();
        } else if (++tries > 80) {
          clearInterval(t);
          setStatus('Failed to load wallet connector. Please refresh and try again.', 'error');
          btn.disabled = false;
        }
      }, 100);
    }

    whenReady(function(){
      MMSDK = new MetaMaskSDK.MetaMaskSDK({
        dappMetadata: { name: 'Heka & Affiliates', url: WP_ORIGIN },
        preferDesktop: false,
        checkInstallationImmediately: false
      });
      btn.addEventListener('click', connect);
    });

    function connect() {
      btn.disabled = true;
      setStatus('<span class="spinner"></span>Opening MetaMask...', 'info');

      MMSDK.connect()
      .then(function(accounts) {
        if (!accounts || !accounts[0]) throw new Error('No accounts returned.');
        var addr     = accounts[0];
        var provider = MMSDK.getProvider() || window.ethereum;
        if (!provider) throw new Error('No provider found after connect.');

        return provider.request({ method: 'eth_chainId' })
        .then(function(chainId) {
          if (chainId !== TARGET_CHAIN_HEX) {
            setStatus('<span class="spinner"></span>Switching to Base Mainnet...', 'info');
            return switchToBase(provider).then(function(){ return addr; });
          }
          return addr;
        });
      })
      .then(function(addr) {
        setStatus('<span class="spinner"></span>Saving wallet...', 'info');
        return saveWalletOnWP(addr);
      })
      .then(function(saved) {
        if (saved) {
          setStatus('✓ Wallet connected! Redirecting to your rewards...', 'success');
          setTimeout(function(){ window.location.href = RETURN_URL; }, 1500);
        } else {
          setStatus('Wallet connected but failed to save. Please try again.', 'error');
          btn.disabled = false;
        }
      })
      .catch(function(err) {
        var msg = (err && err.message) ? err.message : 'Connection failed.';
        if (err && err.code === 4001 || msg.toLowerCase().indexOf('reject') !== -1) {
          setStatus('Connection cancelled.', 'info');
        } else {
          setStatus(msg, 'error');
        }
        btn.disabled = false;
      });
    }

  })();
  </script>
</body>
</html>
