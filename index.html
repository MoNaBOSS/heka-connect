<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Wallet — Heka & Affiliates</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1a1a2e;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }
    .logo {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #f0a020, #ff8a00);
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
    .sub { color: #aaa; font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
    .status {
      padding: 14px 18px; border-radius: 10px;
      font-size: 14px; margin-bottom: 20px;
      display: none; text-align: left;
    }
    .status.info    { background:#0e2a4d;border:1px solid #1a4a8a;color:#88bbff;display:block; }
    .status.success { background:#0a3d1c;border:1px solid #1a6b3a;color:#7fffaa;display:block; }
    .status.error   { background:#4d0e0e;border:1px solid #8a1a1a;color:#ff8888;display:block; }
    .btn {
      background: linear-gradient(135deg, #f0a020, #ff8a00);
      color: #000; border: none;
      padding: 16px 32px; border-radius: 10px;
      font-size: 16px; font-weight: 700;
      cursor: pointer; width: 100%;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .help { margin-top: 24px; text-align: left; font-size: 13px; color: #666; line-height: 1.9; }
    .help li { margin-left: 18px; }
    .spin {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,0.3); border-top-color: #000;
      border-radius: 50%; animation: spin 0.6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">⬢</div>
  <h1>Connect Your Wallet</h1>
  <p class="sub">Link a Web3 wallet to claim your KA Token rewards on Base mainnet.</p>
  <div id="st" class="status"></div>
  <button id="btn" class="btn">Connect Wallet</button>
  <ul class="help">
    <li>Works on desktop &amp; mobile</li>
    <li>Requires <strong style="color:#f0a020">MetaMask</strong> extension or mobile app</li>
    <li>Make sure you're on <strong style="color:#f0a020">Base Mainnet</strong></li>
  </ul>
</div>

<script>
(function () {
  'use strict';

  var TARGET      = '0x2105'; // Base mainnet
  var params      = new URLSearchParams(location.search);
  var WP_NONCE   = params.get('nonce')  || '';
  var RETURN_URL = params.get('return') || 'https://hekaaffiliates.com/affiliate-area/crypto-rewards/';
  var WP_API     = 'https://hekaaffiliates.com/wp-json/kar/v1/wallet';

  var btn = document.getElementById('btn');

  function st(msg, type) {
    var el = document.getElementById('st');
    el.innerHTML = msg;
    el.className = 'status ' + (type || '');
  }

  function saveWallet(addr) {
    return fetch(WP_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-WP-Nonce': WP_NONCE },
      credentials: 'include',
      body: JSON.stringify({ wallet: addr })
    }).then(function (r) { return r.json(); })
      .then(function (d) { return !!(d && d.status === 'saved'); });
  }

  function switchToBase(provider) {
    return provider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: TARGET }] })
      .catch(function (e) {
        if (e && (e.code === 4902 || (e.data && e.data.originalError && e.data.originalError.code === 4902))) {
          return provider.request({
            method: 'wallet_addEthereumChain',
            params: [{ chainId: TARGET, chainName: 'Base', nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 }, rpcUrls: ['https://mainnet.base.org'], blockExplorerUrls: ['https://basescan.org'] }]
          });
        }
        throw e;
      });
  }

  function afterConnect(addr, provider) {
    st('<span class="spin"></span>Checking network...', 'info');
    return provider.request({ method: 'eth_chainId' })
      .then(function (chainId) {
        if (chainId !== TARGET) {
          st('<span class="spin"></span>Switching to Base Mainnet...', 'info');
          return switchToBase(provider).then(function () { return addr; });
        }
        return addr;
      })
      .then(function (a) {
        st('<span class="spin"></span>Saving wallet...', 'info');
        return saveWallet(a);
      })
      .then(function (saved) {
        if (saved) {
          st('✓ Wallet connected! Redirecting...', 'success');
          setTimeout(function () { location.href = RETURN_URL; }, 1200);
        } else {
          st('Wallet connected but save failed. Try again.', 'error');
          btn.disabled = false;
        }
      });
  }

  // ── Desktop: injected wallet (MetaMask extension, Brave, etc.) ──────────────
  function connectInjected() {
    btn.disabled = true;
    st('<span class="spin"></span>Connecting...', 'info');
    var p = window.ethereum;
    p.request({ method: 'eth_requestAccounts' })
      .then(function (accs) { return afterConnect(accs[0], p); })
      .catch(function (e) {
        st(e.code === 4001 ? 'Connection cancelled.' : (e.message || 'Failed.'), e.code === 4001 ? 'info' : 'error');
        btn.disabled = false;
      });
  }

  // ── Mobile: MetaMask deep-link with manual URI ──────────────────────────────
  // Generate a simple eth_requestAccounts deep link for MetaMask mobile.
  // This is the most reliable mobile approach — no relay server needed.
  function connectMobile() {
    btn.disabled = true;
    // Build MetaMask mobile deep link using their custom URL scheme
    // mm-dd:// sends the user directly into the MM app and
    // opens a "Connect to site" prompt automatically.
    var dappUrl   = encodeURIComponent('https://monaboss.github.io/heka-connect/' + location.search);
    var mmDeepLink = 'https://metamask.app.link/dapp/' + 'monaboss.github.io/heka-connect/' + location.search;

    st('Opening MetaMask... If nothing happens, <a href="' + mmDeepLink + '" style="color:#f0a020">tap here</a>.', 'info');

    // Attempt deep link
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = 'metamask://';
    document.body.appendChild(iframe);

    // Redirect to MetaMask universal link after short delay
    setTimeout(function () {
      location.href = mmDeepLink;
    }, 500);

    // When user returns from MetaMask app, window.ethereum should be available
    window.addEventListener('focus', function onFocus() {
      window.removeEventListener('focus', onFocus);
      setTimeout(function () {
        if (window.ethereum) {
          window.ethereum.request({ method: 'eth_accounts' })
            .then(function (accs) {
              if (accs && accs[0]) {
                return afterConnect(accs[0], window.ethereum);
              } else {
                return window.ethereum.request({ method: 'eth_requestAccounts' })
                  .then(function (a) { return afterConnect(a[0], window.ethereum); });
              }
            })
            .catch(function (e) {
              st(e.message || 'Connection failed.', 'error');
              btn.disabled = false;
            });
        } else {
          st('Could not detect wallet. Make sure MetaMask is installed.', 'error');
          btn.disabled = false;
        }
      }, 1000);
    });
  }

  // ── Route based on platform ─────────────────────────────────────────────────
  btn.addEventListener('click', function () {
    if (window.ethereum) {
      connectInjected();
    } else {
      connectMobile();
    }
  });

}());
</script>
</body>
</html>
