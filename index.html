<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Wallet — Heka & Affiliates</title>
  <script type="module">
    import { createAppKit } from 'https://esm.sh/@reown/appkit@1.6.8'
    import { EthersAdapter } from 'https://esm.sh/@reown/appkit-adapter-ethers@1.6.8'
    import { base } from 'https://esm.sh/@reown/appkit@1.6.8/networks'

    const params     = new URLSearchParams(location.search)
    const WP_NONCE   = params.get('nonce')  || ''
    const RETURN_URL = params.get('return') || 'https://hekaaffiliates.com/affiliate-area/crypto-rewards/'
    const WP_API     = 'https://hekaaffiliates.com/wp-json/kar/v1/wallet'

    const btn = document.getElementById('connect-btn')

    function setStatus(msg, type) {
      const el = document.getElementById('status')
      el.innerHTML = msg
      el.className = 'status ' + type
    }

    async function saveWallet(addr) {
      const r = await fetch(WP_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-WP-Nonce': WP_NONCE },
        credentials: 'include',
        body: JSON.stringify({ wallet: addr })
      })
      const d = await r.json()
      return d?.status === 'saved'
    }

    const modal = createAppKit({
      adapters: [new EthersAdapter()],
      networks: [base],
      defaultNetwork: base,
      projectId: '9dbe73fc0675173f87ec2077f1cda3e2',
      metadata: {
        name: 'Heka & Affiliates',
        description: 'KA Token Rewards',
        url: 'https://monaboss.github.io',
        icons: ['https://hekaaffiliates.com/favicon.ico']
      },
      features: { analytics: false, email: false, socials: false, onramp: false, swaps: false },
      themeMode: 'dark',
      themeVariables: { '--w3m-accent': '#f0a020', '--w3m-border-radius-master': '10px' }
    })

    modal.subscribeAccount(async (account) => {
      if (!account.isConnected || !account.address) return
      btn.disabled = true
      setStatus('Saving wallet...', 'info')
      try {
        const saved = await saveWallet(account.address)
        if (saved) {
          setStatus('✓ Wallet saved! Redirecting...', 'success')
          setTimeout(() => { location.href = RETURN_URL }, 1500)
        } else {
          setStatus('Save failed. Please try again.', 'error')
          btn.disabled = false
        }
      } catch(e) {
        setStatus('Error: ' + (e.message || 'Unknown'), 'error')
        btn.disabled = false
      }
    })

    btn.addEventListener('click', () => modal.open())
  </script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#1a1a2e;border-radius:20px;padding:48px 40px;max-width:480px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5)}
    .logo{width:80px;height:80px;background:linear-gradient(135deg,#f0a020,#ff8a00);border-radius:50%;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:36px}
    h1{font-size:28px;font-weight:700;margin-bottom:10px}
    .sub{color:#aaa;font-size:15px;line-height:1.6;margin-bottom:32px}
    .status{padding:14px 18px;border-radius:10px;font-size:14px;margin-bottom:20px;display:none;text-align:left}
    .info{background:#0e2a4d;border:1px solid #1a4a8a;color:#88bbff;display:block}
    .success{background:#0a3d1c;border:1px solid #1a6b3a;color:#7fffaa;display:block}
    .error{background:#4d0e0e;border:1px solid #8a1a1a;color:#ff8888;display:block}
    .btn{background:linear-gradient(135deg,#f0a020,#ff8a00);color:#000;border:none;padding:16px 32px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;width:100%;transition:transform .15s}
    .btn:hover{transform:translateY(-2px)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .help{margin-top:24px;text-align:left;font-size:13px;color:#666;line-height:1.9}
    .help li{margin-left:18px}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⬢</div>
    <h1>Connect Your Wallet</h1>
    <p class="sub">Link your Web3 wallet to claim KA Token rewards on Base mainnet.</p>
    <div id="status" class="status"></div>
    <button id="connect-btn" class="btn">Connect Wallet</button>
    <ul class="help">
      <li>Works with MetaMask, Trust Wallet, Coinbase &amp; 300+ wallets</li>
      <li>Desktop &amp; mobile supported</li>
      <li>Your earned rewards are saved and waiting</li>
    </ul>
  </div>
</body>
</html>
